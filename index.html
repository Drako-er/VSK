<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CrewSwap - 승무원 비행 스왑 플랫폼</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Tailwind Config for Custom Colors -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        navy: {
                            800: '#1e293b',
                            900: '#0f172a',
                        },
                        airline: {
                            blue: '#0284c7',
                            light: '#e0f2fe',
                            accent: '#0369a1'
                        }
                    }
                }
            }
        }
    </script>

    <!-- App-like Mobile Features -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0f172a">

    <style>
        /* Custom Styles for App Feel */
        body {
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        .active-tab {
            color: #0284c7;
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 flex justify-center min-h-screen">

    <!-- Main Responsive App Frame -->
    <div class="w-full max-w-md bg-white min-h-screen flex flex-col shadow-2xl relative pb-20">

        <!-- Top Header Bar -->
        <header class="bg-navy-900 text-white p-4 sticky top-0 z-30 flex justify-between items-center shadow-md">
            <div class="flex items-center space-x-2">
                <i data-lucide="plane" class="text-airline-blue w-6 h-6 transform -rotate-45"></i>
                <h1 class="text-lg font-bold tracking-wider">CREWSWAP</h1>
            </div>
            <div class="flex items-center space-x-3">
                <button onclick="openNotificationModal()" class="relative p-1 rounded-full hover:bg-slate-800 transition">
                    <i data-lucide="bell" class="w-5 h-5 text-slate-300"></i>
                    <span class="absolute top-0 right-0 w-2 h-2 bg-red-500 rounded-full"></span>
                </button>
                <div class="text-xs bg-slate-800 px-2.5 py-1 rounded-full border border-slate-700 text-slate-300">
                    인천(ICN)
                </div>
            </div>
        </header>

        <!-- Dynamic Main Content Views -->
        <main id="app-content" class="flex-1 p-4 overflow-y-auto">
            <!-- Content dynamically rendered via JS -->
        </main>

        <!-- Bottom Navigation Bar -->
        <nav class="fixed bottom-0 w-full max-w-md bg-white border-t border-slate-200 flex justify-around items-center py-2 px-1 z-30 shadow-lg">
            <button onclick="switchTab('feed')" id="nav-feed" class="flex flex-col items-center justify-center w-full py-1 text-airline-blue font-medium transition">
                <i data-lucide="arrow-right-left" class="w-5 h-5 mb-1"></i>
                <span class="text-xs">스왑 피드</span>
            </button>
            <button onclick="switchTab('schedule')" id="nav-schedule" class="flex flex-col items-center justify-center w-full py-1 text-slate-400 hover:text-slate-600 transition">
                <i data-lucide="calendar" class="w-5 h-5 mb-1"></i>
                <span class="text-xs">내 스케줄</span>
            </button>
            <button onclick="switchTab('post')" id="nav-post" class="flex flex-col items-center justify-center w-full py-1 text-slate-400 hover:text-slate-600 transition">
                <div class="bg-airline-blue text-white rounded-full p-2.5 -mt-5 shadow-lg border-4 border-white transform active:scale-95 transition">
                    <i data-lucide="plus" class="w-6 h-6"></i>
                </div>
                <span class="text-xs mt-1">스왑 등록</span>
            </button>
            <button onclick="switchTab('chat')" id="nav-chat" class="flex flex-col items-center justify-center w-full py-1 text-slate-400 hover:text-slate-600 transition relative">
                <i data-lucide="message-square" class="w-5 h-5 mb-1"></i>
                <span class="text-xs">채팅</span>
                <span class="absolute top-1 right-5 w-2 h-2 bg-airline-blue rounded-full"></span>
            </button>
            <button onclick="switchTab('profile')" id="nav-profile" class="flex flex-col items-center justify-center w-full py-1 text-slate-400 hover:text-slate-600 transition">
                <i data-lucide="user" class="w-5 h-5 mb-1"></i>
                <span class="text-xs">마이페이지</span>
            </button>
        </nav>

        <!-- Filter Modal -->
        <div id="filter-modal" class="fixed inset-0 bg-black/50 z-50 flex items-end justify-center hidden">
            <div class="bg-white rounded-t-2xl w-full max-w-md p-6 space-y-4 animate-slide-up">
                <div class="flex justify-between items-center border-b pb-3">
                    <h3 class="text-lg font-bold text-slate-800">스왑 검색 필터</h3>
                    <button onclick="closeFilterModal()" class="text-slate-400 hover:text-slate-600"><i data-lucide="x"></i></button>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-500 uppercase mb-2">기종 (Aircraft)</label>
                    <div class="grid grid-cols-3 gap-2" id="filter-aircraft-options">
                        <button onclick="toggleFilter('aircraft', 'ALL')" class="aircraft-btn active bg-airline-blue text-white py-2 rounded-lg text-xs font-medium border border-airline-blue">전체</button>
                        <button onclick="toggleFilter('aircraft', 'B777')" class="aircraft-btn bg-slate-100 text-slate-600 py-2 rounded-lg text-xs font-medium border">B777</button>
                        <button onclick="toggleFilter('aircraft', 'A350')" class="aircraft-btn bg-slate-100 text-slate-600 py-2 rounded-lg text-xs font-medium border">A350</button>
                        <button onclick="toggleFilter('aircraft', 'A330')" class="aircraft-btn bg-slate-100 text-slate-600 py-2 rounded-lg text-xs font-medium border">A330</button>
                        <button onclick="toggleFilter('aircraft', 'B737')" class="aircraft-btn bg-slate-100 text-slate-600 py-2 rounded-lg text-xs font-medium border">B737</button>
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-500 uppercase mb-2">베이스 (Base)</label>
                    <select id="filter-base" class="w-full bg-slate-50 border rounded-lg p-2.5 text-sm text-slate-700">
                        <option value="ALL">전체 베이스</option>
                        <option value="ICN">ICN (인천)</option>
                        <option value="GMP">GMP (김포)</option>
                        <option value="PUS">PUS (부산)</option>
                    </select>
                </div>
                <div class="pt-4 flex space-x-2">
                    <button onclick="resetFilters()" class="w-1/3 py-3 border border-slate-300 text-slate-600 font-semibold rounded-xl text-sm">초기화</button>
                    <button onclick="applyFilters()" class="w-2/3 py-3 bg-navy-900 text-white font-semibold rounded-xl text-sm shadow-md">필터 적용하기</button>
                </div>
            </div>
        </div>

        <!-- Custom Notification Modal -->
        <div id="notice-modal" class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4 hidden">
            <div class="bg-white rounded-2xl w-full max-w-sm p-6 space-y-4 text-center">
                <div class="w-12 h-12 bg-airline-light text-airline-blue rounded-full flex items-center justify-center mx-auto">
                    <i data-lucide="check-circle" class="w-6 h-6"></i>
                </div>
                <h3 id="modal-title" class="text-lg font-bold text-slate-800">알림</h3>
                <p id="modal-msg" class="text-sm text-slate-600">요청이 성공적으로 완료되었습니다.</p>
                <button onclick="closeNoticeModal()" class="w-full py-2.5 bg-navy-900 text-white font-semibold rounded-xl text-sm">확인</button>
            </div>
        </div>

    </div>

    <script>
        // Data State
        let currentTab = 'feed';
        let selectedAircraft = 'ALL';
        
        // Mock Swap Requests
        let swapRequests = [
            {
                id: 1,
                author: "김수현 AP",
                rank: "승무원",
                aircraft: "B777",
                base: "ICN",
                giveRoute: "ICN ✈ LHR (LA301)",
                giveDate: "10월 12일",
                giveDuty: "FLIGHT",
                getRoute: "OFF / 단거리 요청",
                getDate: "10월 12일 ~ 14일",
                getDuty: "OFF",
                note: "가족 행사로 인해 OFF 원합니다. 13일 OFF 교환 우대!",
                timeAgo: "10분 전",
                status: "OPEN"
            },
            {
                id: 2,
                author: "이민준 CP",
                rank: "부사무장",
                aircraft: "A350",
                base: "ICN",
                giveRoute: "ICN ✈ LAX (OZ202)",
                giveDate: "10월 15일",
                giveDuty: "FLIGHT",
                getRoute: "ICN ✈ NRT / HND",
                getDate: "10월 15일",
                getDuty: "FLIGHT",
                note: "일본 노선으로 변경 희망합니다.",
                timeAgo: "45분 전",
                status: "OPEN"
            },
            {
                id: 3,
                author: "박지민 AP",
                rank: "승무원",
                aircraft: "B737",
                base: "GMP",
                giveRoute: "GMP ✈ CJU (7C115)",
                giveDate: "10월 18일",
                giveDuty: "FLIGHT",
                getRoute: "OFF",
                getDate: "10월 18일",
                getDuty: "OFF",
                note: "당일 퀵턴 스케줄입니다. OFF 교환 구해요!",
                timeAgo: "2시간 전",
                status: "OPEN"
            }
        ];

        // Mock User Schedule
        const mySchedule = [
            { date: "10월 10일", event: "ICN ✈ SIN (OZ751)", type: "FLIGHT" },
            { date: "10월 11일", event: "SIN ✈ ICN (OZ752)", type: "FLIGHT" },
            { date: "10월 12일", event: "OFF", type: "OFF" },
            { date: "10월 13일", event: "OFF", type: "OFF" },
            { date: "10월 14일", event: "ICN ✈ NRT (OZ102)", type: "FLIGHT" },
            { date: "10월 15일", event: "STANDBY (대기)", type: "STBY" }
        ];

        // Initialize Application
        window.onload = function() {
            renderContent();
            lucide.createIcons();
        };

        // Switch Navigation Tabs
        function switchTab(tab) {
            currentTab = tab;
            
            // Update Nav UI
            const navItems = ['feed', 'schedule', 'post', 'chat', 'profile'];
            navItems.forEach(item => {
                const btn = document.getElementById(`nav-${item}`);
                if (btn) {
                    if (item === tab) {
                        btn.classList.add('text-airline-blue');
                        btn.classList.remove('text-slate-400');
                    } else {
                        btn.classList.remove('text-airline-blue');
                        btn.classList.add('text-slate-400');
                    }
                }
            });

            renderContent();
            lucide.createIcons();
        }

        // Render Page Views
        function renderContent() {
            const main = document.getElementById('app-content');

            if (currentTab === 'feed') {
                main.innerHTML = getFeedView();
            } else if (currentTab === 'schedule') {
                main.innerHTML = getScheduleView();
            } else if (currentTab === 'post') {
                main.innerHTML = getPostView();
            } else if (currentTab === 'chat') {
                main.innerHTML = getChatView();
            } else if (currentTab === 'profile') {
                main.innerHTML = getProfileView();
            }
        }

        // View 1: Swap Request Feed View
        function getFeedView() {
            let filteredList = swapRequests.filter(item => {
                if (selectedAircraft !== 'ALL' && item.aircraft !== selectedAircraft) return false;
                return true;
            });

            return `
                <div class="space-y-4">
                    <!-- Search & Filter Header -->
                    <div class="flex items-center space-x-2">
                        <div class="relative flex-1">
                            <i data-lucide="search" class="w-4 h-4 absolute left-3 top-3 text-slate-400"></i>
                            <input type="text" placeholder="노선, 날짜, 이름으로 검색" class="w-full bg-slate-50 border border-slate-200 pl-9 pr-3 py-2 rounded-xl text-xs focus:outline-none focus:border-airline-blue">
                        </div>
                        <button onclick="openFilterModal()" class="flex items-center space-x-1 border border-slate-200 bg-white px-3 py-2 rounded-xl text-xs font-semibold text-slate-700 shadow-sm hover:bg-slate-50">
                            <i data-lucide="sliders-horizontal" class="w-4 h-4"></i>
                            <span>필터</span>
                        </button>
                    </div>

                    <!-- Quick Aircraft Chips -->
                    <div class="flex space-x-2 overflow-x-auto hide-scrollbar py-1">
                        <button onclick="setAircraftFilter('ALL')" class="px-3 py-1 rounded-full text-xs font-semibold ${selectedAircraft === 'ALL' ? 'bg-navy-900 text-white' : 'bg-white text-slate-600 border border-slate-200'}">전체</button>
                        <button onclick="setAircraftFilter('B777')" class="px-3 py-1 rounded-full text-xs font-semibold ${selectedAircraft === 'B777' ? 'bg-navy-900 text-white' : 'bg-white text-slate-600 border border-slate-200'}">B777</button>
                        <button onclick="setAircraftFilter('A350')" class="px-3 py-1 rounded-full text-xs font-semibold ${selectedAircraft === 'A350' ? 'bg-navy-900 text-white' : 'bg-white text-slate-600 border border-slate-200'}">A350</button>
                        <button onclick="setAircraftFilter('A330')" class="px-3 py-1 rounded-full text-xs font-semibold ${selectedAircraft === 'A330' ? 'bg-navy-900 text-white' : 'bg-white text-slate-600 border border-slate-200'}">A330</button>
                        <button onclick="setAircraftFilter('B737')" class="px-3 py-1 rounded-full text-xs font-semibold ${selectedAircraft === 'B737' ? 'bg-navy-900 text-white' : 'bg-white text-slate-600 border border-slate-200'}">B737</button>
                    </div>

                    <!-- Swap Cards Stream -->
                    <div class="space-y-3">
                        ${filteredList.length === 0 ? `
                            <div class="text-center py-12 text-slate-400">
                                <i data-lucide="plane-off" class="w-10 h-10 mx-auto mb-2 opacity-50"></i>
                                <p class="text-sm">조건에 맞는 스왑 게시물이 없습니다.</p>
                            </div>
                        ` : filteredList.map(item => `
                            <div class="bg-white border border-slate-200 rounded-2xl p-4 shadow-sm hover:shadow-md transition">
                                <!-- Card Header -->
                                <div class="flex justify-between items-start pb-3 border-b border-slate-100">
                                    <div class="flex items-center space-x-2">
                                        <div class="w-8 h-8 rounded-full bg-slate-200 flex items-center justify-center font-bold text-slate-600 text-xs">
                                            ${item.author.substring(0, 1)}
                                        </div>
                                        <div>
                                            <div class="flex items-center space-x-1.5">
                                                <span class="text-xs font-bold text-slate-800">${item.author}</span>
                                                <span class="text-[10px] bg-slate-100 text-slate-500 px-1.5 py-0.5 rounded">${item.rank}</span>
                                            </div>
                                            <span class="text-[10px] text-slate-400">${item.timeAgo} • ${item.base}</span>
                                        </div>
                                    </div>
                                    <span class="text-xs font-bold px-2.5 py-1 bg-airline-light text-airline-blue rounded-md border border-sky-200">
                                        ${item.aircraft}
                                    </span>
                                </div>

                                <!-- Card Route Details -->
                                <div class="py-3 grid grid-cols-5 items-center text-center gap-1">
                                    <!-- Giving Schedule -->
                                    <div class="col-span-2 text-left bg-slate-50 p-2.5 rounded-xl border border-slate-100">
                                        <span class="text-[10px] font-bold text-red-500 bg-red-50 px-1.5 py-0.5 rounded">GIVE (양도)</span>
                                        <p class="text-xs font-bold text-slate-800 mt-1">${item.giveRoute}</p>
                                        <p class="text-[11px] text-slate-500">${item.giveDate}</p>
                                    </div>

                                    <!-- Swap Icon -->
                                    <div class="col-span-1 flex justify-center">
                                        <div class="w-7 h-7 bg-slate-100 rounded-full flex items-center justify-center text-slate-500">
                                            <i data-lucide="arrow-right-left" class="w-3.5 h-3.5"></i>
                                        </div>
                                    </div>

                                    <!-- Requesting Schedule -->
                                    <div class="col-span-2 text-left bg-slate-50 p-2.5 rounded-xl border border-slate-100">
                                        <span class="text-[10px] font-bold text-emerald-600 bg-emerald-50 px-1.5 py-0.5 rounded">WANT (희망)</span>
                                        <p class="text-xs font-bold text-slate-800 mt-1">${item.getRoute}</p>
                                        <p class="text-[11px] text-slate-500">${item.getDate}</p>
                                    </div>
                                </div>

                                ${item.note ? `
                                    <p class="text-xs text-slate-600 bg-slate-50/50 p-2 rounded-lg mb-3 italic border border-dashed border-slate-200">
                                        "${item.note}"
                                    </p>
                                ` : ''}

                                <!-- Actions -->
                                <div class="flex space-x-2 pt-1">
                                    <button onclick="requestSwap('${item.author}')" class="flex-1 py-2 bg-navy-900 text-white rounded-xl text-xs font-semibold shadow hover:bg-slate-800 transition">
                                        스왑 요청하기
                                    </button>
                                    <button onclick="switchTab('chat')" class="p-2 border border-slate-200 text-slate-600 rounded-xl hover:bg-slate-50">
                                        <i data-lucide="message-square" class="w-4 h-4"></i>
                                    </button>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        // View 2: User Schedule View
        function getScheduleView() {
            return `
                <div class="space-y-4">
                    <div class="flex justify-between items-center bg-white p-4 rounded-2xl border border-slate-200 shadow-sm">
                        <div>
                            <h2 class="text-sm font-bold text-slate-800">2026년 10월 로스터 (Roster)</h2>
                            <p class="text-xs text-slate-500">내 현재 월간 비행 일정입니다.</p>
                        </div>
                        <button onclick="showNoticeModal('스케줄 동기화', '항공사 서버와 최신 스케줄 동기화가 완료되었습니다.')" class="p-2 bg-slate-100 text-slate-700 rounded-xl text-xs flex items-center space-x-1">
                            <i data-lucide="refresh-cw" class="w-3.5 h-3.5"></i>
                            <span>동기화</span>
                        </button>
                    </div>

                    <div class="bg-white border border-slate-200 rounded-2xl p-4 shadow-sm space-y-3">
                        ${mySchedule.map(item => `
                            <div class="flex items-center justify-between p-3 border-b border-slate-100 last:border-0 hover:bg-slate-50 rounded-xl transition">
                                <div class="flex items-center space-x-3">
                                    <div class="text-center w-12 py-1 bg-slate-100 rounded-lg">
                                        <span class="text-xs font-bold text-slate-700 block">${item.date.split(' ')[0]}</span>
                                        <span class="text-[10px] text-slate-500">${item.date.split(' ')[1]}</span>
                                    </div>
                                    <div>
                                        <p class="text-xs font-bold text-slate-800">${item.event}</p>
                                        <span class="text-[10px] text-slate-400">구분: ${item.type}</span>
                                    </div>
                                </div>
                                ${item.type === 'FLIGHT' ? `
                                    <button onclick="quickPostSwap('${item.event}', '${item.date}')" class="px-2.5 py-1.5 border border-airline-blue text-airline-blue rounded-lg text-xs font-semibold hover:bg-sky-50">
                                        스왑 올리기
                                    </button>
                                ` : `
                                    <span class="text-xs font-medium text-emerald-600 bg-emerald-50 px-2 py-1 rounded">휴무</span>
                                `}
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        // View 3: Create New Swap Request
        function getPostView() {
            return `
                <div class="bg-white border border-slate-200 rounded-2xl p-5 shadow-sm space-y-4">
                    <div class="border-b pb-3">
                        <h2 class="text-base font-bold text-slate-800">새 스왑 요청 등록</h2>
                        <p class="text-xs text-slate-500">교환하고 싶은 비행과 희망 스케줄을 입력하세요.</p>
                    </div>

                    <form onsubmit="handlePostSubmit(event)" class="space-y-4">
                        <!-- Giving Flight Info -->
                        <div class="space-y-2">
                            <label class="block text-xs font-bold text-slate-700 uppercase">보낼 스케줄 (GIVE)</label>
                            <input type="text" id="giveRoute" placeholder="예: ICN ✈ LAX (OZ202)" required class="w-full bg-slate-50 border rounded-xl p-2.5 text-xs focus:outline-none focus:border-airline-blue">
                            <div class="grid grid-cols-2 gap-2">
                                <input type="text" id="giveDate" placeholder="날짜 (예: 10월 20일)" required class="bg-slate-50 border rounded-xl p-2.5 text-xs">
                                <select id="giveAircraft" class="bg-slate-50 border rounded-xl p-2.5 text-xs text-slate-700">
                                    <option value="B777">B777</option>
                                    <option value="A350">A350</option>
                                    <option value="A330">A330</option>
                                    <option value="B737">B737</option>
                                </select>
                            </div>
                        </div>

                        <!-- Requesting Schedule Info -->
                        <div class="space-y-2 pt-2 border-t">
                            <label class="block text-xs font-bold text-slate-700 uppercase">받고 싶은 스케줄 (WANT)</label>
                            <input type="text" id="getRoute" placeholder="예: OFF 또는 단거리 비행" required class="w-full bg-slate-50 border rounded-xl p-2.5 text-xs focus:outline-none focus:border-airline-blue">
                            <input type="text" id="getDate" placeholder="희망 날짜 (예: 10월 20일 ~ 22일)" required class="w-full bg-slate-50 border rounded-xl p-2.5 text-xs">
                        </div>

                        <!-- Additional Details -->
                        <div class="space-y-2 pt-2 border-t">
                            <label class="block text-xs font-bold text-slate-700 uppercase">메모 / 요청사항</label>
                            <textarea id="postNote" rows="2" placeholder="기타 사유나 선호조건을 작성해주세요." class="w-full bg-slate-50 border rounded-xl p-2.5 text-xs focus:outline-none focus:border-airline-blue"></textarea>
                        </div>

                        <button type="submit" class="w-full py-3 bg-navy-900 text-white font-bold rounded-xl text-xs shadow-md hover:bg-slate-800 transition">
                            게시물 등록하기
                        </button>
                    </form>
                </div>
            `;
        }

        // View 4: Chat List View
        function getChatView() {
            return `
                <div class="space-y-3">
                    <h2 class="text-sm font-bold text-slate-800 px-1">스왑 대화함</h2>
                    <div class="bg-white border border-slate-200 rounded-2xl divide-y shadow-sm">
                        <div class="p-4 flex items-center space-x-3 hover:bg-slate-50 cursor-pointer transition">
                            <div class="w-10 h-10 bg-airline-light text-airline-blue font-bold rounded-full flex items-center justify-center">
                                김
                            </div>
                            <div class="flex-1">
                                <div class="flex justify-between items-center">
                                    <h4 class="text-xs font-bold text-slate-800">김수현 AP</h4>
                                    <span class="text-[10px] text-slate-400">오후 2:15</span>
                                </div>
                                <p class="text-xs text-slate-500 truncate mt-0.5">안녕하세요! 12일 LHR 비행 스왑 가능한가요?</p>

                        </div>
                        <div class="p-4 flex items-center space-x-3 hover:bg-slate-50 cursor-pointer transition">
                            <div class="w-10 h-10 bg-slate-100 text-slate-600 font-bold rounded-full flex items-center justify-center">
                                이
                            </div>
                            <div class="flex-1">
                                <div class="flex justify-between items-center">
                                    <h4 class="text-xs font-bold text-slate-800">이민준 CP</h4>
                                    <span class="text-[10px] text-slate-400">어제</span>
                                </div>
                                <p class="text-xs text-slate-500 truncate mt-0.5">네, 스왑 승인 신청 진행해주시면 감사하겠습니다.</p>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        // View 5: Profile View
        function getProfileView() {
            return `
                <div class="space-y-4">
                    <!-- Profile Header Card -->
                    <div class="bg-navy-900 text-white rounded-2xl p-5 shadow-md">
                        <div class="flex items-center space-x-4">
                            <div class="w-14 h-14 bg-airline-blue rounded-full border-2 border-white flex items-center justify-center text-xl font-bold">
                                박
                            </div>
                            <div>
                                <h3 class="text-base font-bold">박지은 승무원</h3>
                                <p class="text-xs text-slate-300">국제선 승무팀 • 인천(ICN) 베이스</p>
                                <span class="inline-block mt-2 text-[10px] bg-slate-800 text-sky-300 px-2 py-0.5 rounded border border-slate-700">인증 승무원</span>
                            </div>
                        </div>
                    </div>

                    <!-- App Options list -->
                    <div class="bg-white border border-slate-200 rounded-2xl divide-y shadow-sm text-xs font-medium text-slate-700">
                        <div onclick="showNoticeModal('PWA 다운로드 안내', '모바일 브라우저의 [공유] 또는 [메뉴] 버튼을 눌러 [홈 화면에 추가]를 클릭하면 앱처럼 설치하여 이용할 수 있습니다.')" class="p-4 flex justify-between items-center hover:bg-slate-50 cursor-pointer">
                            <div class="flex items-center space-x-2">
                                <i data-lucide="download" class="w-4 h-4 text-airline-blue"></i>
                                <span>앱으로 다운로드 (홈 화면에 추가)</span>
                            </div>
                            <i data-lucide="chevron-right" class="w-4 h-4 text-slate-400"></i>
                        </div>
                        <div class="p-4 flex justify-between items-center hover:bg-slate-50 cursor-pointer">
                            <div class="flex items-center space-x-2">
                                <i data-lucide="file-text" class="w-4 h-4 text-slate-500"></i>
                                <span>내 스왑 요청 내역</span>
                            </div>
                            <span class="text-slate-400 text-[11px]">1건 진행 중</span>
                        </div>
                        <div class="p-4 flex justify-between items-center hover:bg-slate-50 cursor-pointer">
                            <div class="flex items-center space-x-2">
                                <i data-lucide="bell" class="w-4 h-4 text-slate-500"></i>
                                <span>스왑 알림 설정</span>
                            </div>
                            <i data-lucide="chevron-right" class="w-4 h-4 text-slate-400"></i>
                        </div>
                        <div class="p-4 flex justify-between items-center hover:bg-slate-50 cursor-pointer">
                            <div class="flex items-center space-x-2">
                                <i data-lucide="shield-check" class="w-4 h-4 text-slate-500"></i>
                                <span>사원 인증 정보</span>
                            </div>
                            <span class="text-emerald-600 text-[11px]">인증완료</span>
                        </div>
                    </div>
                </div>
            `;
        }

        // Handle New Swap Post Creation
        function handlePostSubmit(e) {
            e.preventDefault();
            const giveRoute = document.getElementById('giveRoute').value;
            const giveDate = document.getElementById('giveDate').value;
            const giveAircraft = document.getElementById('giveAircraft').value;
            const getRoute = document.getElementById('getRoute').value;
            const getDate = document.getElementById('getDate').value;
            const postNote = document.getElementById('postNote').value;

            const newPost = {
                id: Date.now(),
                author: "박지은 AP",
                rank: "승무원",
                aircraft: giveAircraft,
                base: "ICN",
                giveRoute: giveRoute,
                giveDate: giveDate,
                giveDuty: "FLIGHT",
                getRoute: getRoute,
                getDate: getDate,
                getDuty: "CUSTOM",
                note: postNote,
                timeAgo: "방금 전",
                status: "OPEN"
            };

            swapRequests.unshift(newPost);
            showNoticeModal("스왑 게시물 등록 완료", "스왑 요청 게시물이 성공적으로 피드에 등록되었습니다.");
            switchTab('feed');
        }

        // Quick Post from Schedule Tab
        function quickPostSwap(flight, date) {
            switchTab('post');
            setTimeout(() => {
                document.getElementById('giveRoute').value = flight;
                document.getElementById('giveDate').value = date;
            }, 50);
        }

        // Request Swap Action
        function requestSwap(author) {
            showNoticeModal('스왑 요청 전달 완료', `${author}님에게 스왑 요청 메시지가 전송되었습니다. 대화함에서 확인해 주세요.`);
        }

        // Aircraft Chip Filter Select
        function setAircraftFilter(aircraft) {
            selectedAircraft = aircraft;
            renderContent();
            lucide.createIcons();
        }

        // Filter Modal Functions
        function openFilterModal() {
            document.getElementById('filter-modal').classList.remove('hidden');
        }

        function closeFilterModal() {
            document.getElementById('filter-modal').classList.add('hidden');
        }

        function toggleFilter(type, value) {
            if (type === 'aircraft') {
                selectedAircraft = value;
                const btns = document.querySelectorAll('.aircraft-btn');
                btns.forEach(btn => {
                    if (btn.innerText === value || (value === 'ALL' && btn.innerText === '전체')) {
                        btn.className = 'aircraft-btn active bg-airline-blue text-white py-2 rounded-lg text-xs font-medium border border-airline-blue';
                    } else {
                        btn.className = 'aircraft-btn bg-slate-100 text-slate-600 py-2 rounded-lg text-xs font-medium border';
                    }
                });
            }
        }

        function resetFilters() {
            selectedAircraft = 'ALL';
            closeFilterModal();
            renderContent();
            lucide.createIcons();
        }

        function applyFilters() {
            closeFilterModal();
            renderContent();
            lucide.createIcons();
        }

        // Generic Notice Modal
        function showNoticeModal(title, msg) {
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-msg').innerText = msg;
            document.getElementById('notice-modal').classList.remove('hidden');
        }

        function closeNoticeModal() {
            document.getElementById('notice-modal').classList.add('hidden');
        }

        function openNotificationModal() {
            showNoticeModal('최근 알림', '새로운 스왑 요청 메시지가 1건 있습니다.');
        }
    </script>
</body>
</html>
